<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BoatLoad — Shipwreck &amp; Sail</title>
    <meta name="description" content="Repair shipwrecked vessels in your maritime workshop, then sail them through a gauntlet of obstacles. A voxel puzzle-arcade game." />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #222233; }
      #canvas { display: block; width: 100vw; height: 100vh; }
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui-root > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
